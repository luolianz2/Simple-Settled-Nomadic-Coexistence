 settled_arkship.10.name: "The Stargazer"
 settled_arkship.10.desc: "When we raise our eyes to the starry sky, no world can chain our free spirits."
 settled_arkship.10.option: "We shall one day ride the sea of stars."
 settled_arkship.11.name: "The Forger"
 settled_arkship.11.desc: "The road ahead is paved; now we breathe a soul into it."
 settled_arkship.11.option: "Gather worlds into one ship; turn one ship into a world."
 settled_arkship.12.name: "The Trailblazer"
 settled_arkship.12.desc: "It is time for some of our own to chart the way ahead."
 settled_arkship.12.option: "It is time to prepare for the voyage."
 settled_arkship.13.name: "The Strider"
 settled_arkship.13.desc: "Great deeds need not be bound to a single world; the sea of stars is our true home."
 settled_arkship.13.option: "A new home, a new journey."
 settled_arkship.14.name: "The Ascender"
 settled_arkship.14.desc: "It is time to press even further."
 settled_arkship.14.option: "The future awaits."
 settled_arkship.15.name: "The Runner"
 settled_arkship.15.desc: "We race with all our might toward the summit."
 settled_arkship.15.option: "The peak is within sight."
 settled_arkship.16.name: "The Soarer"
 settled_arkship.16.desc: "We have reached the summit we once looked up to."
 settled_arkship.16.option: "Onwards, to ever greater excellence."
 settled_arkship.20.name: "The Designer"
 settled_arkship.20.desc: "The arkship's frame is not yet sealed, and the blueprints lie open on the table. Science, civilian, military - each path leads to the sea of stars. It is time to decide the soul of this great vessel."
 settled_arkship.20.option_science: "Science Arkship"
 settled_arkship.20.option_science_tt: "Focused on exploration and research - the arkship will carry the empire's thirst for knowledge."
 settled_arkship.20.option_civilian: "Civilian Arkship"
 settled_arkship.20.option_civilian_tt: "Focused on economy and livelihood - the arkship will be a warm home for wanderers."
 settled_arkship.20.option_military: "Military Arkship"
 settled_arkship.20.option_military_tt: "Focused on defense and conquest - the arkship will be a mobile fortress."
